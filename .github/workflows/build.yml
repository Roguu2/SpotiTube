name: Build

# Pushes and pull requests build Linux only: the source repo is private, where GitHub bills
# Windows minutes ×2 and macOS ×10, and a full build on every push used up the monthly quota.
# Releases (release.yml) still build every platform; run this workflow by hand
# (Actions → Build → Run workflow) to get all three installers without releasing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Intel runner for macOS: Apple Silicon runners are often out of capacity, and the
        # universal .dmg built there runs natively on both kinds of Mac.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","windows-latest","macos-15-intel"]' || '["ubuntu-latest"]') }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & bundle
        run: npm run build

      - name: Package installer
        run: npx electron-builder ${{ fromJSON('{"Linux":"--linux","Windows":"--win","macOS":"--mac"}')[runner.os] }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: SpotiTube-${{ runner.os }}
          path: ${{ fromJSON('{"Linux":"release/*/*.AppImage\nrelease/*/*.deb","Windows":"release/*/*.exe","macOS":"release/*/*.dmg"}')[runner.os] }}
          if-no-files-found: error
          retention-days: 14
