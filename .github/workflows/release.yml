name: Release

# Builds installers for a v* tag and publishes them to the public releases repository,
# which is also the update feed installed apps read. Source stays in this private repo.
#
# Requires the RELEASES_TOKEN secret: a fine-grained personal access token with
# "Contents: Read and write" on the releases repository only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASES_REPO: Roguu2/SpotiTube-releases

jobs:
  # Create the draft once, up front. When each platform job created its own,
  # parallel runs raced and produced duplicate drafts with assets split between them.
  draft:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Check release token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing RELEASES_TOKEN secret (fine-grained PAT with Contents: Read and write on $RELEASES_REPO)"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # electron-builder publishes to the release named after package.json's version;
      # a mismatched tag would make it create yet another release.
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The releases repo has no source history, so notes come from this repo's commits.
      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -vE '^- chore\(release\)' || echo "- Maintenance release"
          } > notes.md
          cat notes.md

      - name: Create draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft \
              --title "SpotiTube ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

  release:
    name: Release (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & bundle
        run: npm run build

      - name: Package & upload to the draft release
        run: npx electron-builder ${{ matrix.target }} --publish always

  # Only a complete release goes live: installed apps start updating the moment it is published.
  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - name: Verify assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in latest.yml latest-mac.yml "SpotiTube-$version-Setup.exe" "SpotiTube-$version-universal.dmg"; do
            if ! grep -qx "$required" <<< "$assets"; then
              echo "::error::Release is missing $required — leaving it as a draft"
              exit 1
            fi
          done

      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft=false --latest
