name: Release

# Builds installers for a v* tag and publishes them as a release of this repository, which
# is also the update feed installed apps read. Uses the built-in GITHUB_TOKEN: no secrets needed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the draft once, up front. When each platform job created its own,
  # parallel runs raced and produced duplicate drafts with assets split between them.
  draft:
    name: Prepare draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # electron-builder publishes to the release named after package.json's version;
      # a mismatched tag would make it create yet another release.
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Write release notes
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          {
            echo "## What's new"
            echo
            git log "$range" --no-merges --pretty='- %s' | grep -vE '^- chore\(release\)' || echo "- Maintenance release"
          } > notes.md
          cat notes.md

      - name: Create draft release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "SpotiTube ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi

  release:
    name: Release (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # Intel runner: Apple Silicon runners are often out of capacity, and the universal
          # .dmg built here runs natively on both kinds of Mac.
          - os: macos-15-intel
            target: --mac
          - os: ubuntu-latest
            target: --linux
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & bundle
        run: npm run build

      - name: Package & upload to the draft release
        run: npx electron-builder ${{ matrix.target }} --publish always

  # Only a complete release goes live: installed apps start updating the moment it is published.
  publish:
    name: Publish release
    needs: release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Verify assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in latest.yml latest-mac.yml latest-linux.yml "SpotiTube-$version-Setup.exe" \
            "SpotiTube-$version-universal.dmg" "SpotiTube-$version-x86_64.AppImage" "SpotiTube-$version-amd64.deb"; do
            if ! grep -qx "$required" <<< "$assets"; then
              echo "::error::Release is missing $required — leaving it as a draft"
              exit 1
            fi
          done

      - name: Publish
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
