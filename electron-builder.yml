appId: com.spotitube.app
productName: SpotiTube
copyright: Copyright © 2026 SpotiTube
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
  # youtubei.js runs through its Node build; its prebuilt bundles for browsers,
  # React Native and Cloudflare Workers are dead weight (~4.5 MB), as are
  # meriyah's UMD and minified copies (the Node build imports its .mjs/.cjs).
  - '!node_modules/youtubei.js/bundle/**'
  - '!node_modules/meriyah/dist/meriyah.{umd.js,umd.min.js,min.mjs}'
# Chromium's UI strings for these languages only (the app itself is in English);
# the other ~50 locale packs are ~47 MB of an install.
electronLanguages:
  - en-US
  - pl
# Lock down what the Electron binary allows: it can't be run as plain Node, take
# NODE_OPTIONS or --inspect, and only loads the app from its asar, which is checked
# against the hash embedded at build time (so a modified app.asar won't start).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
asarUnpack:
  - resources/**
npmRebuild: false

win:
  executableName: SpotiTube
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: SpotiTube
  uninstallDisplayName: SpotiTube
  artifactName: ${productName}-${version}-Setup.${ext}

mac:
  category: public.app-category.music
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch: [universal]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# AppImage runs on any distribution; the .deb installs Chromium's sandbox helper
# properly, which AppImages can't do on Ubuntu 24.04+ without extra setup.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Audio
  executableName: spotitube
  synopsis: Spotify and YouTube Music in one player
  maintainer: Roguu2 <Roguu2@users.noreply.github.com>
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Installers and the update feed are this repository's releases (it's public, so apps
# update without credentials). Up to 0.7.1 they were also published to the now archived
# Roguu2/SpotiTube-releases, which older installs read; its 0.7.1 moved them over here.
publish:
  provider: github
  owner: Roguu2
  repo: SpotiTube
  releaseType: draft
