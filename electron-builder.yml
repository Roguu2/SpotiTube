appId: com.spotitube.app
productName: SpotiTube
copyright: Copyright © 2026 SpotiTube
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
npmRebuild: false

win:
  executableName: SpotiTube
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: SpotiTube
  uninstallDisplayName: SpotiTube
  artifactName: ${productName}-${version}-Setup.${ext}

mac:
  category: public.app-category.music
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  target:
    - target: dmg
      arch: [universal]
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# AppImage runs on any distribution; the .deb installs Chromium's sandbox helper
# properly, which AppImages can't do on Ubuntu 24.04+ without extra setup.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Audio
  executableName: spotitube
  synopsis: Spotify and YouTube Music in one player
  maintainer: Roguu2 <Roguu2@users.noreply.github.com>
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Installers and the update feed are this repository's releases (it's public, so apps
# update without credentials). Up to 0.7.0 they lived in Roguu2/SpotiTube-releases; see
# .github/workflows/release.yml for the bridge that moves those installs over.
publish:
  provider: github
  owner: Roguu2
  repo: SpotiTube
  releaseType: draft
